# PR で通常用ワーカーイメージがビルドできるかだけ確認する (デプロイはしない)
name: build-check

on:
  pull_request:
    paths: ["worker/**", ".github/workflows/build-check.yml"]

jobs:
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        run: docker build --platform linux/amd64 -t worker:check worker
